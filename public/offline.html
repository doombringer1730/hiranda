<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1008">
  <title>Hiranda — offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(40rem 30rem at 80% -10%, rgba(200,132,42,.14), transparent 70%), #0e0a07;
      color: #fef3c7; font-family: Georgia, 'Times New Roman', serif; text-align: center;
    }
    h1 { font-weight: 400; font-size: 2.5rem; margin: 0 0 .5rem; }
    h1 span { color: #e8a040; }
    p { font-family: system-ui, sans-serif; color: #ac9986; margin: 0 0 1.5rem; line-height: 1.5; }
    button {
      font: 500 14px system-ui, sans-serif; color: #fef3c7; background: #b45309;
      border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>Hiranda<span>.</span></h1>
    <p>You&rsquo;re offline right now.<br>We&rsquo;ll be right here when you&rsquo;re back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
