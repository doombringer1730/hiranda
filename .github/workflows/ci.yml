name: CI

# Runs on every pull request and on main: types, lint, game-rule tests and a
# production build. Free on GitHub Actions.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the build can compile; nothing connects to them.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      # Running SQL on the live database must always ask first (see AGENTS.md).
      - name: No pre-approved database tools
        shell: python3 {0}
        run: |
          import json, re, subprocess, sys
          sql = re.compile(r"^mcp__[^_]*supabase[^_]*(__(\*|execute_sql|apply_migration))?$|^mcp__.*__(execute_sql|apply_migration)$", re.I)
          files = subprocess.run(["git", "ls-files", "--", ":(glob)**/.claude/settings*.json"],
                                 capture_output=True, text=True, check=True).stdout.split()
          bad = [(f, rule) for f in files
                 for rule in json.load(open(f)).get("permissions", {}).get("allow", [])
                 if sql.match(rule)]
          for f, rule in bad:
              print(f"::error file={f}::{rule} lets Claude run SQL on the live database without asking. Remove it; personal allowlists go in .claude/settings.local.json.")
          sys.exit(1 if bad else 0)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- src
      - name: Game rules
        run: npm test
      - name: Build
        run: npm run build
